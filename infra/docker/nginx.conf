server {
    listen 80;
    server_name _;

    # Allow headers with underscores (e.g. X_API_KEY) — Nginx strips these by default
    underscores_in_headers on;

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_cache_bypass $http_upgrade;

        # Pass all request headers through to the upstream as-is
        proxy_pass_request_headers on;
    }

    # ── JetCost & Unversioned API ─────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_cache_bypass $http_upgrade;

        # Pass all request headers through to the upstream as-is
        proxy_pass_request_headers on;

        # Preserve custom API key headers — forward all common case variants
        proxy_set_header   X-Api-Key           $http_x_api_key;
        proxy_set_header   X-API-KEY           $http_x_api_key;
        proxy_set_header   api-key             $http_api_key;
        proxy_set_header   JETCOST             $http_jetcost;
        proxy_set_header   JetCost             $http_jetcost;
        proxy_set_header   X-JetCost-Api-Key   $http_x_jetcost_api_key;
    }
}
