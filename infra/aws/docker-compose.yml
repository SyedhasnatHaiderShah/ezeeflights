version: "3.9"
services:
  frontend:
    image: ghcr.io/khurramsagoo/ezeeflights-frontend:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000/api
      INTERNAL_API_BASE_URL: http://backend:4000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 3000
      DISABLE_CSRF: ${DISABLE_CSRF:-false}
    depends_on:
      - backend
  backend:
    image: ghcr.io/khurramsagoo/ezeeflights-backend:latest
    ports:
      - "4000:4000"
    env_file:
      - .env
    #    volumes:
    #     - ./sql:/app/sql
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://fareshoppe.com,https://www.fareshoppe.com,http://localhost:3000}
      FRONTEND_OAUTH_REDIRECT: ${FRONTEND_OAUTH_REDIRECT:-https://www.fareshoppe.com/auth/callback}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      REDIS_URL: redis://redis:6379
      MYSQL_SERVER: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_UID: ${MYSQL_USER:-ezeeflights}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ezeeflights}
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    container_name: ezeeflights-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER:-ezeeflights}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ezeeflights}
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mysql_data:
