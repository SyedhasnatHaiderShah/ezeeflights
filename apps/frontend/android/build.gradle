// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
        }
    }
}

// Keep Capacitor plugin build output out of node_modules (Windows file-lock safe).
subprojects { subproject ->
    def projectPath = subproject.projectDir.absolutePath.replace('\\', '/')
    if (projectPath.contains('/node_modules/')) {
        subproject.layout.buildDirectory.set(
            rootProject.layout.buildDirectory.dir("cap-plugins/${subproject.name}")
        )
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
